<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>编辑课程 - 后台管理</title>
    <link href="./css/admin.css" rel="stylesheet">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="header-bar">
            编辑课程
            <button class="back-btn" onclick="location.href='courselist.html'">返回列表</button>
        </div>

        <div class="section-title">课程信息</div>
        <form id="courseForm">
            <div class="form-grid">
                <div class="form-group">
                    <label class="required" for="courseName">课程名称</label>
                    <input id="courseName" placeholder="请输入课程名称">
                </div>
                <div class="form-group">
                    <label class="required" for="courseNumber">课程编号</label>
                    <input id="courseNumber" placeholder="请输入课程编号">
                </div>
                <div class="form-group full-width">
                    <label for="courseIntroduction">课程介绍</label>
                    <textarea id="courseIntroduction" placeholder="请输入课程介绍"></textarea>
                </div>
                <div class="form-group">
                    <label for="startDate">开课日期</label>
                    <input id="startDate" type="date">
                </div>
                <div class="form-group">
                    <label for="duration">课程时长/学时</label>
                    <input id="duration" placeholder="如：32学时 / 8周">
                </div>
                <div class="form-group full-width">
                    <label for="teachingObjectives">教学目标</label>
                    <textarea id="teachingObjectives" placeholder="请输入教学目标"></textarea>
                </div>
                <div class="form-group">
                    <label for="teachingTeachers">授课教师</label>
                    <input id="teachingTeachers" placeholder="请输入授课教师">
                </div>
                <div class="form-group">
                    <label for="teachingClasses">开课班级</label>
                    <input id="teachingClasses" placeholder="请输入开课班级">
                </div>
                <div class="form-group">
                    <label for="targetAudience">适用对象</label>
                    <input id="targetAudience" placeholder="请输入适用对象">
                </div>
                <div class="form-group">
                    <label for="classAddress">上课地点</label>
                    <input id="classAddress" placeholder="请输入上课地点">
                </div>
                <div class="form-group">
                    <label for="coursePrice">课程价格</label>
                    <input id="coursePrice" type="number" step="0.01">
                </div>
                <div class="form-group">
                    <label for="courseStatus">课程状态</label>
                    <select id="courseStatus">
                        <option value="">请选择</option>
                        <option value="进行中">进行中</option>
                        <option value="已结课">已结课</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="courseTags">课程标签</label>
                    <input id="courseTags" placeholder="多个标签以逗号分隔">
                </div>
                <div class="form-group">
                    <label for="courseImage">课程封面图片 URL</label>
                    <input id="courseImage" placeholder="请输入图片地址">
                </div>
                <div class="form-group full-width">
                    <label for="courseOutline">课程大纲</label>
                    <textarea id="courseOutline" placeholder="请输入课程大纲（支持长文本）"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button class="cancel" type="button" onclick="location.href='courselist.html'">取消</button>
                <button class="save" type="button" id="saveBtn">保存</button>
            </div>
        </form>
    </div>
</div>

<script src="./js/admin-common.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        renderAdminNav("course");
        if (!requireAdminLogin()) return;

        const courseNumber = getParam("courseNumber");
        if (!courseNumber) { toast("缺少课程编号", "error"); setTimeout(function () { location.href = "courselist.html"; }, 1000); return; }

        let currentId = null;

        function loadCourse() {
            // 课程编号唯一，按编号查询取第一条
            apiGet("/course/search", { courseNumber: courseNumber, page: 0, size: 1 })
                .then(function (res) {
                    const list = (res.data && res.data.content) || [];
                    if (!list.length) { toast("未找到该课程", "error"); return; }
                    const c = list[0];
                    currentId = c.id;
                    document.getElementById("courseName").value = c.courseName || "";
                    document.getElementById("courseNumber").value = c.courseNumber || "";
                    document.getElementById("courseIntroduction").value = c.courseIntroduction || "";
                    document.getElementById("startDate").value = c.startDate || "";
                    document.getElementById("duration").value = c.duration || "";
                    document.getElementById("teachingObjectives").value = c.teachingObjectives || "";
                    document.getElementById("teachingTeachers").value = c.teachingTeachers || "";
                    document.getElementById("teachingClasses").value = c.teachingClasses || "";
                    document.getElementById("targetAudience").value = c.targetAudience || "";
                    document.getElementById("classAddress").value = c.classAddress || "";
                    document.getElementById("coursePrice").value = c.coursePrice == null ? "" : c.coursePrice;
                    document.getElementById("courseStatus").value = c.courseStatus || "";
                    document.getElementById("courseTags").value = c.courseTags || "";
                    document.getElementById("courseImage").value = c.courseImage || "";
                    document.getElementById("courseOutline").value = c.courseOutline || "";
                })
                .catch(function (err) { toast("加载课程信息失败：" + err.message, "error"); });
        }

        document.getElementById("saveBtn").addEventListener("click", function () {
            if (!currentId) { toast("课程尚未加载完成", "warn"); return; }
            const courseName = document.getElementById("courseName").value.trim();
            const courseNumber2 = document.getElementById("courseNumber").value.trim();
            if (!courseName) { toast("课程名称为必填", "warn"); return; }
            if (!courseNumber2) { toast("课程编号为必填", "warn"); return; }

            const price = document.getElementById("coursePrice").value;
            const body = {
                courseName: courseName,
                courseNumber: courseNumber2,
                courseIntroduction: document.getElementById("courseIntroduction").value.trim(),
                startDate: document.getElementById("startDate").value,
                teachingObjectives: document.getElementById("teachingObjectives").value.trim(),
                duration: document.getElementById("duration").value.trim(),
                teachingTeachers: document.getElementById("teachingTeachers").value.trim(),
                teachingClasses: document.getElementById("teachingClasses").value.trim(),
                targetAudience: document.getElementById("targetAudience").value.trim(),
                classAddress: document.getElementById("classAddress").value.trim(),
                coursePrice: price === "" ? null : parseFloat(price),
                courseStatus: document.getElementById("courseStatus").value,
                courseTags: document.getElementById("courseTags").value.trim(),
                courseImage: document.getElementById("courseImage").value.trim(),
                courseOutline: document.getElementById("courseOutline").value.trim()
            };

            const btn = document.getElementById("saveBtn");
            btn.disabled = true;
            apiPut("/course/update", body, { id: currentId })
                .then(function () { toast("保存成功"); setTimeout(function () { location.href = "courselist.html"; }, 700); })
                .catch(function (err) { toast("保存失败：" + err.message, "error"); btn.disabled = false; });
        });

        loadCourse();
    });
</script>
</body>
</html>
