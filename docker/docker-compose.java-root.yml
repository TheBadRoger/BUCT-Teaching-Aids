# 独立使用此文件；公共服务定义复用完整编排。
services:
  mysql:
    extends:
      file: docker-compose.yml
      service: mysql
  redis:
    extends:
      file: docker-compose.yml
      service: redis
  java-app:
    extends:
      file: docker-compose.yml
      service: java-app

volumes:
  mysql_data:
  redis_data:
  java_data:
