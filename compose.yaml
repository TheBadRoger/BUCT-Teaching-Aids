name: buct-teaching-aids

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  credentials-init:
    image: ${PYTHON_IMAGE:-python:3.11-slim-bookworm}
    restart: "no"
    network_mode: none
    command: ["python", "/init_credentials.py"]
    volumes:
      - ./scripts/deployment/init_credentials.py:/init_credentials.py:ro
      - mysql_credentials:/credentials/mysql
      - java_credentials:/credentials/java
      - python_credentials:/credentials/python
      - redis_credentials:/credentials/redis
      - mysql_data:/existing-mysql:ro
    logging: *logging

  mysql:
    depends_on:
      credentials-init:
        condition: service_completed_successfully
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD_FILE: /run/credentials/root_password
      MYSQL_DATABASE: BUCTTA_DATABASE
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_credentials:/run/credentials:ro
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$(cat /run/credentials/root_password)\" mysql -h 127.0.0.1 -uroot -Nse 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20
    logging: *logging

  redis:
    depends_on:
      credentials-init:
        condition: service_completed_successfully
    image: ${REDIS_IMAGE:-redis:7.2-alpine}
    restart: unless-stopped
    command: ["redis-server", "/run/credentials/redis.conf"]
    volumes:
      - redis_credentials:/run/credentials:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$(cat /run/credentials/password)" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  java-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: java
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9-eclipse-temurin-25}
        JAVA_IMAGE: ${JAVA_IMAGE:-eclipse-temurin:25-jre}
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_FLYWAY_ENABLED: "false"
      SERVER_PORT: 8080
      SERVER_SHUTDOWN: graceful
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/BUCTTA_DATABASE?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
      POLYMAS_AUTH_KEY: ${POLYMAS_AUTH_KEY:-}
      POLYMAS_APP_CODE: ${POLYMAS_APP_CODE:-}
      POLYMAS_USER_NID: ${POLYMAS_USER_NID:-}
      POLYMAS_SESSION_NID: ${POLYMAS_SESSION_NID:-}
      POLYMAS_CHAT_NID: ${POLYMAS_CHAT_NID:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_REQUEST_TIMEOUT: ${DEEPSEEK_REQUEST_TIMEOUT:-60000}
      MEDIA_ROOT: /app/data/uploads
      MEDIA_PUBLIC_URL_PREFIX: ${MEDIA_PUBLIC_URL_PREFIX:-}
    depends_on:
      credentials-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${JAVA_HOST_PORT:-4444}:8080"
    volumes:
      - java_credentials:/run/credentials:ro
      - java_data:/app/data
    logging: *logging

  python-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: python
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim-bookworm}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DEBUG: "false"
      PORT: 8080
      SECRET_KEY: ${PYTHON_SECRET_KEY:?Set PYTHON_SECRET_KEY in .env}
      MYSQL_HOST: mysql
      CREDENTIALS_DIR: /run/credentials
      MYSQL_DB: BUCTTA_DATABASE
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      FACE_DB_PATH: /app/face_database/face_db
      UPLOAD_DIR: /app/data/uploads
      CLASSROOM_DB_PATH: /app/data/classroom_data.db
      YOLO_MODEL_PATH: /app/data/models/yolov8n-pose.pt
      YOLO_CONFIG_DIR: /app/data/ultralytics
    depends_on:
      credentials-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    volumes:
      - ${FACE_DATABASE_DIR:-./apps/api/python/face_database}:/app/face_database
      - python_credentials:/run/credentials:ro
      - python_data:/app/data
    logging: *logging

volumes:
  mysql_credentials:
  java_credentials:
  python_credentials:
  redis_credentials:
  mysql_data:
  redis_data:
  java_data:
  python_data:
