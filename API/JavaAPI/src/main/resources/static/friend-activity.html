<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>好友动态 - 北化教学辅助系统</title>
  <link href="./css/frontend.css" rel="stylesheet">
  <link href="./css/friend-activity.css" rel="stylesheet">
</head>
<body>
<div data-site-header></div>
<div data-sub-nav></div>

<main class="page-main page-main--offset-sub">
  <nav aria-label="面包屑" class="breadcrumb">
    <a href="index.html">首页</a> / <span>好友动态</span>
  </nav>

  <div class="layout-with-sidebar">
    <div data-side-nav></div>

    <div class="layout-content">
      <header class="flex-between mb-lg">
        <div>
          <h1 class="page-title">好友动态</h1>
          <p class="page-desc mb-sm" id="activity-summary">正在加载同学们的公开笔记…</p>
        </div>
        <a class="btn btn--primary" href="my-note.html">发表我的笔记</a>
      </header>

      <form class="filter-bar" id="activity-filter" role="search">
        <div class="form-group">
          <label class="form-group__label" for="activity-mode">动态范围</label>
          <select class="form-control" id="activity-mode" name="mode">
            <option value="latest">最新公开笔记</option>
            <option value="popular">热门笔记</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-group__label" for="activity-keyword">搜索内容</label>
          <input class="form-control" id="activity-keyword" name="keyword" type="search"
                 placeholder="按标题或内容搜索">
        </div>
        <div class="flex gap-sm">
          <button class="btn btn--primary" type="submit">刷新动态</button>
        </div>
      </form>

      <div id="activity-feed" aria-live="polite"></div>
      <div class="pagination" id="activity-pagination"></div>
    </div>
  </div>
</main>

<script src="./js/friend-activity.js" type="module"></script>
</body>
</html>
