<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>编辑教师 - 后台管理</title>
    <link href="./css/admin.css" rel="stylesheet">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="header-bar">
            编辑教师
            <button class="back-btn" onclick="location.href='teacherlist.html'">返回列表</button>
        </div>

        <div class="section-title">教师基本信息</div>
        <form id="teacherForm">
            <div class="form-grid">
                <div class="form-group">
                    <label class="required" for="name">教师姓名</label>
                    <input id="name" placeholder="请输入教师姓名">
                </div>
                <div class="form-group">
                    <label class="required" for="organization">所属机构</label>
                    <input id="organization" placeholder="请输入所属院系/单位">
                </div>
                <div class="form-group">
                    <label class="required" for="gender">性别</label>
                    <select id="gender">
                        <option value="">请选择</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="required" for="education">最高学历</label>
                    <select id="education">
                        <option value="">请选择</option>
                        <option value="博士">博士</option>
                        <option value="硕士">硕士</option>
                        <option value="本科">本科</option>
                        <option value="专科">专科</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="required" for="jointime">入职时间</label>
                    <input id="jointime" type="date">
                </div>
            </div>

            <div class="section-title" style="margin-top:22px">关联账号（只读，由系统维护）</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>用户名</label>
                    <input id="username" disabled>
                </div>
                <div class="form-group">
                    <label>联系电话</label>
                    <input id="telephone" disabled>
                </div>
                <div class="form-group">
                    <label>电子邮件</label>
                    <input id="email" disabled>
                </div>
            </div>

            <div class="form-actions">
                <button class="cancel" type="button" onclick="location.href='teacherlist.html'">取消</button>
                <button class="save" type="button" id="saveBtn">保存</button>
            </div>
        </form>
    </div>
</div>

<script src="./js/admin-common.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        renderAdminNav("teacher");
        if (!requireAdminLogin()) return;

        const id = getParam("id");
        if (!id) { toast("缺少教师 ID", "error"); setTimeout(function () { location.href = "teacherlist.html"; }, 1000); return; }

        // 按 ID 加载教师详情回填表单
        apiGet("/teacher/" + id)
            .then(function (res) {
                const t = res.data;
                document.getElementById("name").value = t.name || "";
                document.getElementById("organization").value = t.organization || "";
                document.getElementById("gender").value = t.gender || "";
                document.getElementById("education").value = t.education || "";
                document.getElementById("jointime").value = t.jointime || "";
                document.getElementById("username").value = t.username || "";
                document.getElementById("telephone").value = t.telephone || "";
                document.getElementById("email").value = t.email || "";
            })
            .catch(function (err) { toast("加载教师信息失败：" + err.message, "error"); });

        document.getElementById("saveBtn").addEventListener("click", function () {
            if (!document.getElementById("name").value.trim()) { toast("教师姓名不能为空", "warn"); return; }

            const body = {
                name: document.getElementById("name").value.trim(),
                organization: document.getElementById("organization").value.trim(),
                gender: document.getElementById("gender").value,
                education: document.getElementById("education").value,
                jointime: document.getElementById("jointime").value
            };
            const btn = document.getElementById("saveBtn");
            btn.disabled = true;
            apiPut("/teacher/update", body, { id: id })
                .then(function () { toast("保存成功"); setTimeout(function () { location.href = "teacherlist.html"; }, 700); })
                .catch(function (err) { toast("保存失败：" + err.message, "error"); btn.disabled = false; });
        });
    });
</script>
</body>
</html>
