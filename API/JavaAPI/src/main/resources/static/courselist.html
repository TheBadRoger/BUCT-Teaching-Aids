<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>课程列表 - 后台管理</title>
    <link href="./css/admin.css" rel="stylesheet">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="header-bar">
            课程列表
            <div class="breadcrumb">首页 &gt; 课程列表</div>
        </div>

        <div class="filter-area">
            <div class="filter-item">
                <label>课程名称</label>
                <input id="f-coursename" placeholder="请输入课程名称">
            </div>
            <div class="filter-item">
                <label>课程编号</label>
                <input id="f-coursenumber" placeholder="请输入课程编号">
            </div>
            <div class="filter-item">
                <label>授课教师</label>
                <input id="f-teacher" placeholder="请输入授课教师">
            </div>
            <div class="filter-item">
                <label>课程状态</label>
                <select id="f-status">
                    <option value="">全部</option>
                    <option value="进行中">进行中</option>
                    <option value="已结课">已结课</option>
                </select>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-primary" id="queryBtn">查询</button>
            <button class="btn-default" id="resetBtn">重置</button>
            <button class="btn-info" id="addBtn">新增课程</button>
            <button class="btn-danger" id="deleteBtn">批量删除</button>
            <button class="btn-default" id="exportBtn">导出</button>
        </div>

        <div class="data-count" id="dataCount">共查询到 0 条数据</div>
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th><input id="selectAll" type="checkbox"> 全选</th>
                    <th>ID</th>
                    <th>课程名称</th>
                    <th>课程编号</th>
                    <th>授课教师</th>
                    <th>开课日期</th>
                    <th>课程时长</th>
                    <th>课程价格</th>
                    <th>状态</th>
                    <th>访问量</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<script src="./js/admin-common.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        renderAdminNav("course");
        if (!requireAdminLogin()) return;

        let currentPage = 0, totalPages = 0;

        function collectFilter() {
            return {
                courseName: document.getElementById("f-coursename").value.trim(),
                courseNumber: document.getElementById("f-coursenumber").value.trim(),
                teachingTeachers: document.getElementById("f-teacher").value.trim(),
                courseStatus: document.getElementById("f-status").value
            };
        }

        function load(page) {
            currentPage = page || 0;
            const params = Object.assign({ page: currentPage, size: 10, sort: "id" }, collectFilter());
            apiGet("/course/search", params)
                .then(function (res) {
                    const pageData = res.data || { content: [], totalElements: 0, totalPages: 0 };
                    totalPages = pageData.totalPages || 0;
                    renderTable(pageData.content || []);
                    document.getElementById("dataCount").textContent = "共查询到 " + (pageData.totalElements || 0) + " 条数据";
                    renderPagination(document.getElementById("pagination"), currentPage, totalPages, load);
                })
                .catch(function (err) { toast("加载课程列表失败：" + err.message, "error"); });
        }

        function renderTable(list) {
            const tbody = document.getElementById("tbody");
            if (!list.length) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="11">暂无数据</td></tr>';
                return;
            }
            tbody.innerHTML = list.map(function (c) {
                return '<tr>' +
                    '<td><input type="checkbox" class="row-check" value="' + c.id + '"></td>' +
                    '<td>' + escapeHtml(c.id) + '</td>' +
                    '<td>' + escapeHtml(c.courseName) + '</td>' +
                    '<td>' + escapeHtml(c.courseNumber) + '</td>' +
                    '<td>' + escapeHtml(c.teachingTeachers) + '</td>' +
                    '<td>' + escapeHtml(c.startDate) + '</td>' +
                    '<td>' + escapeHtml(c.duration) + '</td>' +
                    '<td>' + escapeHtml(c.coursePrice) + '</td>' +
                    '<td>' + escapeHtml(c.courseStatus) + '</td>' +
                    '<td>' + escapeHtml(c.viewCount) + '</td>' +
                    '<td>' +
                        '<a data-action="view" data-num="' + escapeHtml(c.courseNumber) + '">查看</a>' +
                        '<a data-action="edit" data-num="' + escapeHtml(c.courseNumber) + '">编辑</a>' +
                    '</td>' +
                    '</tr>';
            }).join("");
            tbody.querySelectorAll("a[data-action]").forEach(function (a) {
                a.addEventListener("click", function () {
                    const num = a.dataset.num;
                    if (a.dataset.action === "edit") location.href = "editcourse.html?courseNumber=" + encodeURIComponent(num);
                    else location.href = "course-detail.html?courseNumber=" + encodeURIComponent(num);
                });
            });
        }

        document.getElementById("selectAll").addEventListener("change", function () {
            document.querySelectorAll(".row-check").forEach(function (c) { c.checked = this.checked; }, this);
        });

        function getCheckedIds() {
            return Array.prototype.slice.call(document.querySelectorAll(".row-check:checked"))
                .map(function (c) { return parseInt(c.value, 10); });
        }

        document.getElementById("queryBtn").addEventListener("click", function () { load(0); });
        document.getElementById("resetBtn").addEventListener("click", function () {
            ["f-coursename", "f-coursenumber", "f-teacher", "f-status"].forEach(function (id) {
                document.getElementById(id).value = "";
            });
            load(0);
        });
        document.getElementById("addBtn").addEventListener("click", function () { location.href = "addcourse.html"; });

        document.getElementById("deleteBtn").addEventListener("click", function () {
            const ids = getCheckedIds();
            if (!ids.length) { toast("请至少勾选一门课程", "warn"); return; }
            if (!confirm("确定删除选中的 " + ids.length + " 门课程吗？")) return;
            apiDelete("/course/batch", ids)
                .then(function () { toast("删除成功"); load(currentPage); })
                .catch(function (err) { toast("删除失败：" + err.message, "error"); });
        });

        document.getElementById("exportBtn").addEventListener("click", function () {
            location.href = API_BASE + "/course/export";
        });

        load(0);
    });
</script>
</body>
</html>
