<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>新增教师 - 后台管理</title>
    <link href="./css/admin.css" rel="stylesheet">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="header-bar">
            新增教师
            <button class="back-btn" onclick="location.href='teacherlist.html'">返回列表</button>
        </div>

        <div class="section-title">教师基本信息</div>
        <form id="teacherForm">
            <div class="form-grid">
                <div class="form-group">
                    <label class="required" for="name">教师姓名</label>
                    <input id="name" placeholder="请输入教师姓名">
                    <div class="error-message" id="nameErr"></div>
                </div>
                <div class="form-group">
                    <label class="required" for="organization">所属机构</label>
                    <input id="organization" placeholder="请输入所属院系/单位">
                    <div class="error-message" id="orgErr"></div>
                </div>
                <div class="form-group">
                    <label class="required" for="gender">性别</label>
                    <select id="gender">
                        <option value="">请选择</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                    <div class="error-message" id="genderErr"></div>
                </div>
                <div class="form-group">
                    <label class="required" for="education">最高学历</label>
                    <select id="education">
                        <option value="">请选择</option>
                        <option value="博士">博士</option>
                        <option value="硕士">硕士</option>
                        <option value="本科">本科</option>
                        <option value="专科">专科</option>
                    </select>
                    <div class="error-message" id="educationErr"></div>
                </div>
                <div class="form-group">
                    <label class="required" for="jointime">入职时间</label>
                    <input id="jointime" type="date">
                    <div class="error-message" id="jointimeErr"></div>
                </div>
            </div>

            <div class="section-title" style="margin-top:22px">登录账号（选填，不填则自动生成/默认密码 123456）</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input id="username" placeholder="不填则自动生成，如 T+时间戳">
                </div>
                <div class="form-group">
                    <label for="password">登录密码</label>
                    <input id="password" type="text" placeholder="不填则默认为 123456">
                </div>
                <div class="form-group">
                    <label for="telephone">联系电话</label>
                    <input id="telephone" placeholder="请输入手机号">
                </div>
                <div class="form-group">
                    <label for="email">电子邮件</label>
                    <input id="email" type="email" placeholder="请输入邮箱">
                </div>
            </div>

            <div class="form-actions">
                <button class="cancel" type="button" onclick="location.href='teacherlist.html'">取消</button>
                <button class="save" type="button" id="saveBtn">保存</button>
            </div>
        </form>
    </div>
</div>

<script src="./js/admin-common.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        renderAdminNav("add-teacher");
        if (!requireAdminLogin()) return;

        const saveBtn = document.getElementById("saveBtn");

        function showErr(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg; el.style.display = msg ? "block" : "none";
            return !msg;
        }

        function validate() {
            let ok = true;
            ok = showErr("nameErr", document.getElementById("name").value.trim() ? "" : "请填写教师姓名") && ok;
            ok = showErr("orgErr", document.getElementById("organization").value.trim() ? "" : "请填写所属机构") && ok;
            ok = showErr("genderErr", document.getElementById("gender").value ? "" : "请选择性别") && ok;
            ok = showErr("educationErr", document.getElementById("education").value ? "" : "请选择学历") && ok;
            ok = showErr("jointimeErr", document.getElementById("jointime").value ? "" : "请选择入职时间") && ok;
            return ok;
        }

        saveBtn.addEventListener("click", function () {
            if (!validate()) { toast("请完善必填信息", "warn"); return; }

            const body = {
                teacher: {
                    name: document.getElementById("name").value.trim(),
                    organization: document.getElementById("organization").value.trim(),
                    gender: document.getElementById("gender").value,
                    education: document.getElementById("education").value,
                    jointime: document.getElementById("jointime").value
                },
                username: document.getElementById("username").value.trim() || null,
                password: document.getElementById("password").value || null,
                telephone: document.getElementById("telephone").value.trim() || null,
                email: document.getElementById("email").value.trim() || null
            };

            saveBtn.disabled = true;
            // POST /api/teacher/add-with-user，同时创建教师及其绑定的登录用户
            apiPost("/teacher/add-with-user", body)
                .then(function () {
                    toast("新增教师成功");
                    setTimeout(function () { location.href = "teacherlist.html"; }, 700);
                })
                .catch(function (err) {
                    toast("新增失败：" + err.message, "error");
                    saveBtn.disabled = false;
                });
        });
    });
</script>
</body>
</html>
