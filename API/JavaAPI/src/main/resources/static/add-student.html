<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>新增学生 - 后台管理</title>
    <link href="./css/admin.css" rel="stylesheet">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="header-bar">
            新增学生
            <button class="back-btn" onclick="location.href='studentlist.html'">返回列表</button>
        </div>

        <div class="section-title">学生基本信息</div>
        <form id="studentForm">
            <div class="form-grid">
                <div class="form-group">
                    <label class="required" for="studentNumber">学号</label>
                    <input id="studentNumber" placeholder="请输入学号">
                    <div class="error-message" id="numErr"></div>
                </div>
                <div class="form-group">
                    <label class="required" for="name">学生姓名</label>
                    <input id="name" placeholder="请输入学生姓名">
                    <div class="error-message" id="nameErr"></div>
                </div>
                <div class="form-group">
                    <label class="required" for="className">班级</label>
                    <input id="className" placeholder="请输入班级">
                    <div class="error-message" id="classErr"></div>
                </div>
                <div class="form-group">
                    <label class="required" for="gender">性别</label>
                    <select id="gender">
                        <option value="">请选择</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                    <div class="error-message" id="genderErr"></div>
                </div>
                <div class="form-group">
                    <label class="required" for="admissionDate">入学日期</label>
                    <input id="admissionDate" type="date">
                    <div class="error-message" id="admissionErr"></div>
                </div>
            </div>

            <div class="section-title" style="margin-top:22px">登录账号（选填，不填则默认学号/123456）</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input id="username" placeholder="不填则默认使用学号">
                </div>
                <div class="form-group">
                    <label for="password">登录密码</label>
                    <input id="password" type="text" placeholder="不填则默认为 123456">
                </div>
                <div class="form-group">
                    <label for="telephone">联系电话</label>
                    <input id="telephone" placeholder="请输入手机号">
                </div>
                <div class="form-group">
                    <label for="email">电子邮件</label>
                    <input id="email" type="email" placeholder="请输入邮箱">
                </div>
            </div>

            <div class="form-actions">
                <button class="cancel" type="button" onclick="location.href='studentlist.html'">取消</button>
                <button class="save" type="button" id="saveBtn">保存</button>
            </div>
        </form>
    </div>
</div>

<script src="./js/admin-common.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        renderAdminNav("add-student");
        if (!requireAdminLogin()) return;

        const saveBtn = document.getElementById("saveBtn");

        function showErr(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg; el.style.display = msg ? "block" : "none";
            return !msg;
        }

        function validate() {
            let ok = true;
            ok = showErr("numErr", document.getElementById("studentNumber").value.trim() ? "" : "请填写学号") && ok;
            ok = showErr("nameErr", document.getElementById("name").value.trim() ? "" : "请填写学生姓名") && ok;
            ok = showErr("classErr", document.getElementById("className").value.trim() ? "" : "请填写班级") && ok;
            ok = showErr("genderErr", document.getElementById("gender").value ? "" : "请选择性别") && ok;
            ok = showErr("admissionErr", document.getElementById("admissionDate").value ? "" : "请选择入学日期") && ok;
            return ok;
        }

        saveBtn.addEventListener("click", function () {
            if (!validate()) { toast("请完善必填信息", "warn"); return; }

            const body = {
                student: {
                    studentNumber: document.getElementById("studentNumber").value.trim(),
                    name: document.getElementById("name").value.trim(),
                    className: document.getElementById("className").value.trim(),
                    gender: document.getElementById("gender").value,
                    admissionDate: document.getElementById("admissionDate").value
                },
                username: document.getElementById("username").value.trim() || null,
                password: document.getElementById("password").value || null,
                telephone: document.getElementById("telephone").value.trim() || null,
                email: document.getElementById("email").value.trim() || null
            };

            saveBtn.disabled = true;
            // POST /api/students/add-with-user，同时创建学生及其绑定的登录用户
            apiPost("/students/add-with-user", body)
                .then(function () {
                    toast("新增学生成功");
                    setTimeout(function () { location.href = "studentlist.html"; }, 700);
                })
                .catch(function (err) {
                    toast("新增失败：" + err.message, "error");
                    saveBtn.disabled = false;
                });
        });
    });
</script>
</body>
</html>
