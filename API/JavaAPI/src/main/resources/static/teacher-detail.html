<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>教师介绍 - 后台管理</title>
    <link href="./css/admin.css" rel="stylesheet">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="header-bar">
            教师介绍
            <button class="back-btn" onclick="location.href='teacherlist.html'">返回列表</button>
        </div>

        <div class="section-title">基本信息</div>
        <table class="detail-table">
            <tbody>
            <tr><th>ID</th><td id="d-id"></td></tr>
            <tr><th>教师姓名</th><td id="d-name"></td></tr>
            <tr><th>所属机构</th><td id="d-org"></td></tr>
            <tr><th>性别</th><td id="d-gender"></td></tr>
            <tr><th>最高学历</th><td id="d-education"></td></tr>
            <tr><th>入职时间</th><td id="d-jointime"></td></tr>
            </tbody>
        </table>

        <div class="section-title" style="margin-top:22px">关联账号</div>
        <table class="detail-table">
            <tbody>
            <tr><th>用户名</th><td id="d-username"></td></tr>
            <tr><th>联系电话</th><td id="d-telephone"></td></tr>
            <tr><th>电子邮件</th><td id="d-email"></td></tr>
            <tr><th>用户类型</th><td id="d-userType"></td></tr>
            </tbody>
        </table>

        <div class="form-actions">
            <button class="cancel" type="button" onclick="location.href='teacherlist.html'">返回列表</button>
            <button class="save" type="button" id="editBtn">编辑</button>
        </div>
    </div>
</div>

<script src="./js/admin-common.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        renderAdminNav("teacher");
        if (!requireAdminLogin()) return;

        const id = getParam("id");
        if (!id) { toast("缺少教师 ID", "error"); setTimeout(function () { location.href = "teacherlist.html"; }, 1000); return; }

        apiGet("/teacher/" + id)
            .then(function (res) {
                const t = res.data;
                document.getElementById("d-id").textContent = t.id;
                document.getElementById("d-name").textContent = t.name || "-";
                document.getElementById("d-org").textContent = t.organization || "-";
                document.getElementById("d-gender").textContent = t.gender || "-";
                document.getElementById("d-education").textContent = t.education || "-";
                document.getElementById("d-jointime").textContent = t.jointime || "-";
                document.getElementById("d-username").textContent = t.username || "-";
                document.getElementById("d-telephone").textContent = t.telephone || "-";
                document.getElementById("d-email").textContent = t.email || "-";
                document.getElementById("d-userType").textContent = t.userType || "-";
            })
            .catch(function (err) { toast("加载教师信息失败：" + err.message, "error"); });

        document.getElementById("editBtn").addEventListener("click", function () {
            location.href = "edit-teacher.html?id=" + id;
        });
    });
</script>
</body>
</html>
