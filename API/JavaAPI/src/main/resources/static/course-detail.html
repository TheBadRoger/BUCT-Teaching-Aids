<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>课程介绍 - 后台管理</title>
    <link href="./css/admin.css" rel="stylesheet">
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="header-bar">
            课程介绍
            <button class="back-btn" onclick="location.href='courselist.html'">返回列表</button>
        </div>

        <div class="section-title">课程信息</div>
        <table class="detail-table">
            <tbody>
            <tr><th>ID</th><td id="d-id"></td></tr>
            <tr><th>课程名称</th><td id="d-coursename"></td></tr>
            <tr><th>课程编号</th><td id="d-coursenumber"></td></tr>
            <tr><th>开课日期</th><td id="d-startdate"></td></tr>
            <tr><th>课程时长</th><td id="d-duration"></td></tr>
            <tr><th>授课教师</th><td id="d-teacher"></td></tr>
            <tr><th>开课班级</th><td id="d-classes"></td></tr>
            <tr><th>适用对象</th><td id="d-audience"></td></tr>
            <tr><th>上课地点</th><td id="d-address"></td></tr>
            <tr><th>课程价格</th><td id="d-price"></td></tr>
            <tr><th>课程状态</th><td id="d-status"></td></tr>
            <tr><th>课程标签</th><td id="d-tags"></td></tr>
            <tr><th>访问量</th><td id="d-view"></td></tr>
            </tbody>
        </table>

        <div class="section-title" style="margin-top:22px">课程介绍</div>
        <div style="line-height:1.8;color:#444;padding:0 4px 8px;" id="d-intro"></div>

        <div class="section-title" style="margin-top:22px">教学目标</div>
        <div style="line-height:1.8;color:#444;padding:0 4px 8px;" id="d-objectives"></div>

        <div class="section-title" style="margin-top:22px">课程大纲</div>
        <div style="line-height:1.8;color:#444;padding:0 4px 8px;" id="d-outline"></div>

        <div class="section-title" style="margin-top:22px">课程封面</div>
        <div style="padding:0 4px 12px;">
            <img id="d-image" alt="课程封面" style="max-width:320px;max-height:200px;border:1px solid #eee;border-radius:4px;">
        </div>

        <div class="form-actions">
            <button class="cancel" type="button" onclick="location.href='courselist.html'">返回列表</button>
            <button class="save" type="button" id="editBtn">编辑</button>
        </div>
    </div>
</div>

<script src="./js/admin-common.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        renderAdminNav("course");
        if (!requireAdminLogin()) return;

        const courseNumber = getParam("courseNumber");
        if (!courseNumber) { toast("缺少课程编号", "error"); setTimeout(function () { location.href = "courselist.html"; }, 1000); return; }

        apiGet("/course/search", { courseNumber: courseNumber, page: 0, size: 1 })
            .then(function (res) {
                const list = (res.data && res.data.content) || [];
                if (!list.length) { toast("未找到该课程", "error"); return; }
                const c = list[0];
                const set = function (id, v) { document.getElementById(id).textContent = (v === null || v === undefined || v === "") ? "-" : v; };
                set("d-id", c.id);
                set("d-coursename", c.courseName);
                set("d-coursenumber", c.courseNumber);
                set("d-startdate", c.startDate);
                set("d-duration", c.duration);
                set("d-teacher", c.teachingTeachers);
                set("d-classes", c.teachingClasses);
                set("d-audience", c.targetAudience);
                set("d-address", c.classAddress);
                set("d-price", c.coursePrice);
                set("d-status", c.courseStatus);
                set("d-tags", c.courseTags);
                set("d-view", c.viewCount);
                document.getElementById("d-intro").textContent = c.courseIntroduction || "-";
                document.getElementById("d-objectives").textContent = c.teachingObjectives || "-";
                document.getElementById("d-outline").textContent = c.courseOutline || "-";
                const img = document.getElementById("d-image");
                if (c.courseImage) { img.src = c.courseImage; img.style.display = "block"; }
                else { img.style.display = "none"; }
                document.getElementById("editBtn").addEventListener("click", function () {
                    location.href = "editcourse.html?courseNumber=" + encodeURIComponent(courseNumber);
                });
            })
            .catch(function (err) { toast("加载课程信息失败：" + err.message, "error"); });
    });
</script>
</body>
</html>
