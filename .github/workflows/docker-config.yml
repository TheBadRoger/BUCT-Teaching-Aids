name: Docker Configuration

on:
  push:
    branches: [main]
    paths:
      - 'compose.yaml'
      - 'Dockerfile'
      - '.env.example'
      - 'database/init/**'
      - 'apps/api/python/deployment/**'
      - '.dockerignore'
      - 'apps/web/**'
      - 'apps/api/teacher-ai/**'
      - '.github/workflows/docker-config.yml'
  pull_request:
    paths:
      - 'compose.yaml'
      - 'Dockerfile'
      - '.env.example'
      - 'database/init/**'
      - 'apps/api/python/deployment/**'
      - '.dockerignore'
      - 'apps/web/**'
      - 'apps/api/teacher-ai/**'
      - '.github/workflows/docker-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci-only-root
      BUCTTA_JAVA_DB_PASSWORD: ci-only-java
      BUCTTA_PYTHON_DB_PASSWORD: ci-only-python
      REDIS_PASSWORD: ci-only-redis
      APP_ADMIN_PASSWORD: ci-only-admin
      PYTHON_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete deployment
        run: docker compose config --quiet
      - name: Verify required credentials
        run: |
          if env -u MYSQL_ROOT_PASSWORD docker compose config --quiet 2>/dev/null; then
            echo 'Missing database password must fail validation'
            exit 1
          fi
      - name: Test container startup configuration
        run: python3 -m unittest discover -s apps/api/python/deployment -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/teacher-ai/package-lock.json
      - name: Test teacher AI API without calling the model
        working-directory: apps/api/teacher-ai
        run: |
          npm ci
          npm test
      - name: Build complete project images
        run: |
          docker compose build
      - name: Check teacher AI container without calling the model
        run: |
          docker compose up -d --no-deps --wait --wait-timeout 120 teacher-ai
          curl --fail http://127.0.0.1:3000/api/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=100 teacher-ai
      - name: Stop smoke-test containers
        if: always()
        run: docker compose down
