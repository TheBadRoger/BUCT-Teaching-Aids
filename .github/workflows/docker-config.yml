name: Docker Configuration

on:
  push:
    branches: [main]
    paths:
      - 'compose.yaml'
      - 'Dockerfile'
      - '.env.example'
      - 'database/init/**'
      - 'scripts/deployment/**'
      - 'apps/api/python/deployment/**'
      - '.dockerignore'
      - 'apps/web/**'
      - 'apps/api/java/**'
      - '.github/workflows/docker-config.yml'
  pull_request:
    paths:
      - 'compose.yaml'
      - 'Dockerfile'
      - '.env.example'
      - 'database/init/**'
      - 'scripts/deployment/**'
      - 'apps/api/python/deployment/**'
      - '.dockerignore'
      - 'apps/web/**'
      - 'apps/api/java/**'
      - '.github/workflows/docker-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_ADMIN_PASSWORD: ci-only-admin
      PYTHON_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete deployment
        run: docker compose config --quiet
      - name: Verify required credentials
        run: |
          if env -u APP_ADMIN_PASSWORD docker compose config --quiet 2>/dev/null; then
            echo 'Missing platform admin password must fail validation'
            exit 1
          fi
      - name: Test container startup configuration
        run: python3 -m unittest discover -s apps/api/python/deployment -p 'test_*.py' -v
      - name: Test persistent credential generation
        run: python3 -m unittest discover -s scripts/deployment -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test Java teacher AI without calling the model
        working-directory: apps/api/java
        run: mvn -B -Dtest=TeacherAICtrlTest test
      - name: Build complete project images
        run: |
          docker compose build
      - name: Verify generated MySQL and Redis credentials
        run: |
          docker compose up -d --wait --wait-timeout 180 mysql redis
          docker compose exec -T mysql sh -ec 'MYSQL_PWD="$(cat /run/credentials/java_password)" mysql -u"$(cat /run/credentials/java_user)" -Nse "SELECT 1" BUCTTA_DATABASE >/dev/null'
          docker compose exec -T mysql sh -ec 'MYSQL_PWD="$(cat /run/credentials/python_password)" mysql -u"$(cat /run/credentials/python_user)" -Nse "SELECT 1" BUCTTA_DATABASE >/dev/null'
          docker compose run --rm --no-deps credentials-init
          docker compose exec -T mysql sh -ec 'MYSQL_PWD="$(cat /run/credentials/java_password)" mysql -u"$(cat /run/credentials/java_user)" -Nse "SELECT 1" BUCTTA_DATABASE >/dev/null'
          docker compose exec -T redis sh -ec 'REDISCLI_AUTH="$(cat /run/credentials/password)" redis-cli ping | grep -q PONG'
      - name: Show infrastructure logs on failure
        if: failure()
        run: docker compose logs --tail=100 credentials-init mysql redis
      - name: Stop validation containers
        if: always()
        run: docker compose down
