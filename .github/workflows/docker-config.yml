name: Docker Configuration

on:
  push:
    branches: [main]
    paths:
      - 'compose.yaml'
      - 'Dockerfile'
      - '.env.example'
      - 'database/init/**'
      - 'apps/api/python/deployment/**'
      - '.dockerignore'
      - 'apps/web/**'
      - 'apps/api/java/**'
      - '.github/workflows/docker-config.yml'
  pull_request:
    paths:
      - 'compose.yaml'
      - 'Dockerfile'
      - '.env.example'
      - 'database/init/**'
      - 'apps/api/python/deployment/**'
      - '.dockerignore'
      - 'apps/web/**'
      - 'apps/api/java/**'
      - '.github/workflows/docker-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci-only-root
      BUCTTA_JAVA_DB_PASSWORD: ci-only-java
      BUCTTA_PYTHON_DB_PASSWORD: ci-only-python
      REDIS_PASSWORD: ci-only-redis
      APP_ADMIN_PASSWORD: ci-only-admin
      PYTHON_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - name: Validate complete deployment
        run: docker compose config --quiet
      - name: Verify required credentials
        run: |
          if env -u MYSQL_ROOT_PASSWORD docker compose config --quiet 2>/dev/null; then
            echo 'Missing database password must fail validation'
            exit 1
          fi
      - name: Test container startup configuration
        run: python3 -m unittest discover -s apps/api/python/deployment -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test Java teacher AI without calling the model
        working-directory: apps/api/java
        run: mvn -B -Dtest=TeacherAICtrlTest test
      - name: Build complete project images
        run: |
          docker compose build
