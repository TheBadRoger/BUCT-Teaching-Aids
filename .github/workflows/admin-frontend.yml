name: Admin Frontend
on:
  push:
    branches: [main]
    paths: ['apps/web/admin/**', '.github/workflows/admin-frontend.yml']
  pull_request:
    paths: ['apps/web/admin/**', '.github/workflows/admin-frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/admin/package-lock.json
      - run: npm ci
      - run: npm run check
